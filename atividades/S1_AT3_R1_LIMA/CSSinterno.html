<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página com estilo CSS interno">
    <meta http-equiv="X-UA-Compatible" content="ie=edge"> 
    <title>CSS_Interno</title>
    <style>
        body {
            background-color: grey;
            font-size: 25px;
            font-family: Arial, Arial, Helvetica, sans-serif;
        }
        h1 {
            color: white;
            font-family: 'Times New Roman', Times, serif;
        }
        p{
            color: white;
        }
        .paragrafo {
            color: black;
        }
        .card {
            background-color: red;
            color: white;
            font-size: 24px;
            padding: 10px;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <h1>CSS Interno</h1>
    <h1 style="color: white;">Este título pode ser diferente?</h1>
    <div>
        <p class="paragrafo">Este é um exemplo com estilo CSS interno.</p>
    </div>
</body>
</html>
